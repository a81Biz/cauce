# Publicación a npm, a mano y con registro.
#
# POR QUÉ NO SE PUBLICA DESDE UNA MÁQUINA
#   Publicar desde el portátil de alguien deja el token en su disco, la operación sin rastro y
#   el resultado dependiendo de qué tuviera esa máquina en ese momento. Aquí el token vive en
#   los secretos del repositorio, la ejecución queda registrada con quién la lanzó, y lo que se
#   publica es exactamente lo que hay en `main` — verificado en esta misma corrida.
#
# POR QUÉ ES MANUAL
#   Publicar es irreversible: npm no permite despublicar salvo en una ventana muy estrecha. Es
#   una decisión humana, como todo lo que `SUITE-R06` mantiene fuera de la automatización. Se
#   lanza desde la pestaña Actions, o con `gh workflow run publicar.yml`.
#
# QUÉ IMPIDE
#   - Publicar algo que no se certifica a sí mismo: la verificación corre antes y bloquea.
#   - Republicar una versión que ya existe: se comprueba contra el registro y se para.
#   - Publicar desde una rama que no sea `main`.

name: publicar

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe PUBLICAR para confirmar. Es irreversible.'
        required: true
        default: ''

permissions:
  contents: read
  id-token: write        # procedencia firmada por npm (--provenance)

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: La confirmación es literal
        run: |
          if [ "${{ inputs.confirmacion }}" != "PUBLICAR" ]; then
            echo "Confirmación ausente o distinta de PUBLICAR. No se publica nada."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Solo desde main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Rama ${{ github.ref_name }}: solo se publica desde main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Publicación SIN credencial: npm confía en este repositorio y este workflow, y GitHub
      # se autentica con OIDC. No hay token que rotar, que filtrar ni que caducar — y un
      # secreto muerto en el repositorio es exactamente lo que había antes de esto.
      #
      # Requiere configurarlo una vez en npmjs.com → el paquete → Settings → Trusted Publisher:
      #   repositorio a81Biz/cauce · workflow publicar.yml
      # Y npm 11.5.1 o superior, que es más nuevo que el que trae el runner.
      - name: npm reciente, para OIDC
        run: npm install -g npm@latest

      # El marco no se publica si no puede certificarse a sí mismo. Las cuatro bloquean.
      - name: Coherencia interna
        run: npm run verify:suite
      - name: Núcleo sincronizado con sus fuentes
        run: npm run core:check
      - name: Cobertura de la auditoría
        run: npm run audit
      - name: Batería de casos
        run: npm run selftest

      # `FND-R29` · «Instalar la suite implica que el repositorio va a publicarse, y publicar es
      # irreversible donde importa». Esto es el publicar: npm no permite despublicar salvo en una
      # ventana muy estrecha, y un secreto en la historia sigue ahí tras borrarlo del archivo.
      # Faltaba —la regla existía y la compuerta no—; lo encontró Foundation (D9).
      - name: Ningún secreto sin firmar
        run: node docs/methodology/tools/revisar-secretos.mjs . --historial

      - name: Esta versión no puede existir ya
        run: |
          NOMBRE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Comprobando $NOMBRE@$VERSION"
          if npm view "$NOMBRE@$VERSION" version >/dev/null 2>&1; then
            echo "$NOMBRE@$VERSION ya está publicada. Sube la versión en package.json y el CHANGELOG."
            exit 1
          fi
          echo "Libre. Se publica $NOMBRE@$VERSION."

      - name: Publicar
        run: npm publish --provenance --access public

      - name: Qué quedó publicado
        run: |
          NOMBRE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "### Publicado \`$NOMBRE@$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Lanzado por: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- https://www.npmjs.com/package/$NOMBRE" >> $GITHUB_STEP_SUMMARY
